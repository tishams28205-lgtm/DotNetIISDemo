
name: ASP.NET Core CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # JOB 1: BUILD AND PUBLISH
  build:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore DotNetIISDemo.csproj

      - name: Build application
        run: dotnet build DotNetIISDemo.csproj --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish DotNetIISDemo.csproj --configuration Release --output ./publish

      - name: Upload published artifact
        uses: actions/upload-artifact@v4
        with:
          name: DotNetIISDemo-publish
          path: ./publish/
          retention-days: 5

  # JOB 2: DEPLOY TO IIS
  deploy:
    name: Deploy to IIS
    needs: build
    if: github.event_name == 'push'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Download published artifact
        uses: actions/download-artifact@v4
        with:
          name: DotNetIISDemo-publish
          path: ./publish

      - name: Deploy application to IIS
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $deployPath = "C:\inetpub\DotNetIISDemo"
          $sourcePath = Join-Path $env:GITHUB_WORKSPACE "publish"
          $offlineFile = Join-Path $deployPath "app_offline.htm"

          Write-Host "Starting IIS deployment..."

          # Verify deployment paths
          if (!(Test-Path -LiteralPath $sourcePath)) {
              throw "Published artifact folder not found!"
          }

          if (!(Test-Path -LiteralPath $deployPath)) {
              throw "IIS deployment folder not found!"
          }

          try {
              # Take application offline
              Set-Content -LiteralPath $offlineFile -Value "Application updating..."

              Start-Sleep -Seconds 5

              # Synchronize published files
              robocopy $sourcePath $deployPath /MIR /XF app_offline.htm /R:3 /W:5

              $copyResult = $LASTEXITCODE

              Write-Host "Robocopy exit code: $copyResult"

              # Robocopy codes below 8 indicate success
              if ($copyResult -ge 8) {
                  throw "Robocopy failed with exit code $copyResult"
              }

              Write-Host "Application files copied successfully!"
          }
          finally {
              # File.Delete does not fail if the file is missing
              [System.IO.File]::Delete($offlineFile)

              Write-Host "Offline file cleanup completed."
          }

          Write-Host "IIS deployment completed successfully!"
	  
	  $global:LASTEXITCODE = 0
	  exit 0