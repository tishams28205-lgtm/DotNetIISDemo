
name: ASP.NET Core CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore DotNetIISDemo.csproj

      - name: Build application
        run: dotnet build DotNetIISDemo.csproj --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish DotNetIISDemo.csproj --configuration Release --output ./publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DotNetIISDemo-publish
          path: ./publish/
