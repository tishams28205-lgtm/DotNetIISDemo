
name: ASP.NET Core CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore DotNetIISDemo.csproj

      - name: Build application
        run: dotnet build DotNetIISDemo.csproj --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish DotNetIISDemo.csproj --configuration Release --output ./publish

      - name: Upload published files
        uses: actions/upload-artifact@v4
        with:
          name: DotNetIISDemo-publish
          path: ./publish/

  deploy:
    name: Deploy to IIS
    needs: build
    if: github.event_name == 'push'
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Download published artifact
        uses: actions/download-artifact@v4
        with:
          name: DotNetIISDemo-publish
          path: ./publish

      - name: Deploy to IIS
        shell: powershell
        run: |
          $deployPath = "C:\inetpub\DotNetIISDemo"
          $sourcePath = "$env:GITHUB_WORKSPACE\publish"

          if (!(Test-Path $sourcePath)) {
              throw "Published files not found!"
          }

          if (!(Test-Path $deployPath)) {
              throw "IIS deployment folder not found!"
          }

          Set-Content -Path "$deployPath\app_offline.htm" -Value "Application updating..."

          Start-Sleep -Seconds 5

          robocopy $sourcePath $deployPath /MIR /R:3 /W:5

          if ($LASTEXITCODE -ge 8) {
              throw "Deployment failed. Robocopy exit code: $LASTEXITCODE"
          }

          Remove-Item "$deployPath\app_offline.htm" -Force

          Write-Host "Deployment to IIS completed successfully!"
